version: '3.8'

services:
  # 1. Production PostgreSQL Database with Persistent Storage Volume
  db:
    image: postgres:16-alpine
    container_name: course_erp_db
    restart: always
    environment:
      POSTGRES_DB: coursedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-NorthStarDB@2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coursedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Flask REST API Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: course_erp_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      PORT: 5000
      SECRET_KEY: ${SECRET_KEY:-northstar-production-security-secret-key-2026}
      CORS_ORIGINS: "*"
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-NorthStarDB@2026}@db:5432/coursedb
      OCR_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@2026}
    ports:
      - "5000:5000"

  # 3. React Frontend Service (Served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: course_erp_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  # Named persistent volume ensuring database data persists across redeployments
  postgres_data:
    driver: local
